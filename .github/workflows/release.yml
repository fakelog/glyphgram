name: Android Release

on:
  push:
    branches:
      - 'develop'
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        submodules: recursive
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Make all scripts executable
      run: |
        chmod +x gradlew
        chmod +x presentation/src/main/cpp/build.sh

    - name: Decode Google Services JSON
      env:
        GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      run: echo "$GOOGLE_SERVICES_JSON" > app/google-services.json

    - name: Decode Keystore
      env:
        RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
      run: echo "$RELEASE_KEYSTORE" | base64 --decode > release.keystore

    - name: Create local.properties
      run: |
        echo "API_ID=${{ secrets.API_ID }}" >> local.properties
        echo "API_HASH=${{ secrets.API_HASH }}" >> local.properties
        echo "RELEASE_STORE_FILE=release.keystore" >> local.properties
        echo "RELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}" >> local.properties
        echo "RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}" >> local.properties
        echo "RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}" >> local.properties

    - name: Build libvpx
      run: cd presentation/src/main/cpp && ./build.sh

    - name: Build Release APKs
      run: ./gradlew assembleAllReleaseTdlibApks

    - name: Generate Release Notes
      id: release_notes
      run: |
        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 "${{ github.ref }}^" 2>/dev/null || git rev-list --max-parents=0 HEAD)
          echo "CHANGELOG=$(git log $PREVIOUS_TAG..${{ github.ref }} --oneline --pretty=format:"- %s (%h)")" >> $GITHUB_OUTPUT
          echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          echo "IS_PRERELEASE=false" >> $GITHUB_OUTPUT
        else
          echo "CHANGELOG=$(git log -1 --oneline --pretty=format:"- %s (%h)")" >> $GITHUB_OUTPUT
          echo "TAG_NAME=dev-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "IS_PRERELEASE=true" >> $GITHUB_OUTPUT
        fi

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.release_notes.outputs.TAG_NAME }}
        name: Release ${{ steps.release_notes.outputs.TAG_NAME }}
        body: |
          ### Changes in this release:
          ${{ steps.release_notes.outputs.CHANGELOG }}
        draft: false
        prerelease: ${{ steps.release_notes.outputs.IS_PRERELEASE }}
        files: app/releases/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
